name: Build iOS App

# Manual trigger only — unlike Android, this workflow needs 8 GitHub Secrets
# from a paid Apple Developer account before it can succeed (see notes at the
# bottom). Running it automatically on every push would just fail loudly
# until that one-time setup is done, so it's dispatched by hand instead.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npx tsc -b && npx vite build

      - name: Sync Capacitor (also runs pod install)
        run: npx cap sync ios

      - name: Copy Muscle Assets
        run: |
          cp -r public/muscles ios/App/App/public/muscles
          echo "Muscles copied: $(ls ios/App/App/public/muscles | wc -l) files"
          du -sh ios/App/App/public/muscles

      - name: Verify signing secrets are configured
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          missing=()
          [ -z "$BUILD_CERTIFICATE_BASE64" ] && missing+=("IOS_CERTIFICATE_BASE64")
          [ -z "$P12_PASSWORD" ] && missing+=("IOS_CERTIFICATE_PASSWORD")
          [ -z "$BUILD_PROVISION_PROFILE_BASE64" ] && missing+=("IOS_PROVISION_PROFILE_BASE64")
          [ -z "$KEYCHAIN_PASSWORD" ] && missing+=("IOS_KEYCHAIN_PASSWORD")
          [ -z "$IOS_TEAM_ID" ] && missing+=("IOS_TEAM_ID")
          [ -z "$IOS_PROVISIONING_PROFILE_NAME" ] && missing+=("IOS_PROVISIONING_PROFILE_NAME")
          [ -z "$IOS_CODE_SIGN_IDENTITY" ] && missing+=("IOS_CODE_SIGN_IDENTITY")
          [ -z "$IOS_BUNDLE_ID" ] && missing+=("IOS_BUNDLE_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            echo "This workflow needs a paid Apple Developer account's certificate"
            echo "and provisioning profile before it can sign a build. See the setup"
            echo "notes at the bottom of .github/workflows/ios-build.yml, then add"
            echo "these secrets under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All signing secrets are present."

      # ── Code signing ──────────────────────────────────────────────────
      # Unlike Android's single keystore file, Apple requires a distribution
      # certificate (.p12) AND a provisioning profile, imported into a
      # temporary CI keychain. See the setup notes at the bottom of this
      # file for how to create/export each of these.
      - name: Import Code-Signing Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          file "$CERTIFICATE_PATH"  # sanity check: should say "data" or similar, not "empty"

          # Temporary keychain, scoped to this CI run only
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive App
        working-directory: ./ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY"

      - name: Export IPA
        working-directory: ./ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniBody-iOS-Release
          path: ${{ runner.temp }}/export/*.ipa

# ── One-time setup: GitHub Secrets required ──────────────────────────────
#
# Unlike Android (one keystore file), Apple needs a paid Apple Developer
# Program membership ($99/yr) plus a certificate + provisioning profile
# pair. Create these once on your Mac in Xcode / developer.apple.com, then
# add as repo secrets (Settings → Secrets and variables → Actions):
#
#   IOS_CERTIFICATE_BASE64        `base64 -i Certificates.p12 | pbcopy`
#                                  (export your "Apple Distribution" cert
#                                  from Keychain Access as a .p12 first)
#   IOS_CERTIFICATE_PASSWORD      the password you set when exporting the .p12
#   IOS_PROVISION_PROFILE_BASE64  `base64 -i YourProfile.mobileprovision | pbcopy`
#                                  (an Ad Hoc profile — devices must be
#                                  registered in it to install the .ipa)
#   IOS_KEYCHAIN_PASSWORD         any password — just for the throwaway CI keychain
#   IOS_TEAM_ID                   Apple Developer Team ID (developer.apple.com → Membership)
#   IOS_PROVISIONING_PROFILE_NAME the profile's exact Name (not filename) from
#                                  Xcode → Signing & Capabilities, or the profile itself
#   IOS_CODE_SIGN_IDENTITY        e.g. "Apple Distribution: Your Name (TEAMID)"
#   IOS_BUNDLE_ID                 com.omnibody.training — this project's actual bundle ID
#                                  (ios/App/App.xcodeproj → PRODUCT_BUNDLE_IDENTIFIER),
#                                  must also match the provisioning profile's App ID
